name: Design and Contract Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-contracts:
    name: contract-fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Record immutable execution evidence
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          printf 'GVN_EXECUTION context=contract-fixtures sha=%s tree=%s parents=%s\n' \
            "$GITHUB_SHA" "$(git rev-parse "$GITHUB_SHA^{tree}")" "$(git show -s --format=%P "$GITHUB_SHA")"
          printf 'GVN_RUNNER context=contract-fixtures label=ubuntu-24.04 os=%s arch=%s image_os=%s image_version=%s repository=%s event=%s shallow=false\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:?missing ImageOS}" "${ImageVersion:?missing ImageVersion}" "$GITHUB_REPOSITORY" "$GITHUB_EVENT_NAME"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate design and contract assets
        run: python scripts/validate_design_assets.py
      - name: Validate documentation links
        run: python scripts/validate_markdown_links.py
      - name: Validate governance state
        run: python scripts/validate_governance_state.py --self-test
