name: Design and Contract Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-contracts:
    name: contract-fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate design and contract assets
        run: python scripts/validate_design_assets.py
