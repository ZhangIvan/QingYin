name: Rust Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.97.0

jobs:
  format-lint:
    name: format-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        run: rustup toolchain install $RUSTUP_TOOLCHAIN --profile minimal
      - name: Install Rust components
        run: rustup component add rustfmt clippy --toolchain $RUSTUP_TOOLCHAIN
      - name: Check formatting
        run: cargo +$RUSTUP_TOOLCHAIN fmt --all -- --check
      - name: Lint workspace
        run: cargo +$RUSTUP_TOOLCHAIN clippy --workspace --all-targets -- -D warnings
      - name: Validate workspace boundaries
        run: python scripts/validate_workspace_boundaries.py
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        run: rustup toolchain install $RUSTUP_TOOLCHAIN --profile minimal
      - name: Run workspace tests
        run: cargo +$RUSTUP_TOOLCHAIN test --workspace --all-targets
